<html>
<head>
</head>
<body>
Starting download...<br>
Click <a id="link">here</a> if not start.
<iframe id="my_iframe" style="display:none;"></iframe>
<script>
fetch('https://api.github.com/repos/badernageral/bgfinancas/releases/latest')
  .then(function(r){ return r.json(); })
  .then(function(data){
    var asset = data.assets.find(function(a){ return a.name.endsWith('.deb'); });
    if(asset){
      document.getElementById('link').href = asset.browser_download_url;
      document.getElementById('my_iframe').src = asset.browser_download_url;
    }
  });
</script>
</body>
</html>
